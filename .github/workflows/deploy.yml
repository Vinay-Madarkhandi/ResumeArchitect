name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Inspect Worker
        run: npm run build:worker

      - name: Run Test Suite
        run: NODE_OPTIONS=--max-old-space-size=2048 npm test

  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -P ${{ secrets.VPS_PORT || 22 }} "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e
            DEPLOY_DIR="/opt/resumearchitect"
            mkdir -p "$DEPLOY_DIR"

            # Sync repo to deploy directory if not a git clone, or pull latest main
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              cd "$DEPLOY_DIR"
              git clone https://github.com/Vinay-Madarkhandi/ResumeArchitect.git .
            fi

            # Build and deploy production containers
            docker compose up -d --build web worker migrate postgres redis localstack

            # Reload host Caddy reverse proxy
            if docker ps -q -f name=ping-caddy | grep -q .; then
              docker exec ping-caddy caddy reload --config /etc/caddy/Caddyfile || true
            fi

            # Verify health
            echo "Waiting for web service to be healthy..."
            for i in $(seq 1 30); do
              if curl -s -f http://127.0.0.1:3100/api/health >/dev/null 2>&1; then
                echo "Health check PASSED on attempt $i!"
                exit 0
              fi
              echo "Waiting ($i/30)..."
              sleep 2
            done

            echo "ERROR: Web health check timed out!"
            docker compose logs --tail 50 web
            exit 1
          EOF
