<body class="h-full flex flex-col font-body-lg text-body-lg text-on-background bg-background selection:bg-secondary-container selection:text-on-secondary-container">
<main class="flex-1 flex items-center justify-center p-margin-mobile md:p-margin-desktop min-h-screen">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-[0_4px_12px_rgba(15,23,42,0.08)] flex flex-col gap-lg transition-shadow hover:shadow-[0_8px_24px_rgba(15,23,42,0.12)]">
<div class="text-center space-y-sm pb-sm">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">ResumeArchitect</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to your professional workspace.</p>
</div>
<form action="#" class="space-y-lg flex flex-col" method="POST">
<div class="space-y-sm">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input autocomplete="email" class="block w-full rounded pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors" id="email" name="email" placeholder="colleague@company.com" required="" type="email"/>
</div>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-secondary-fixed transition-colors underline-offset-4 hover:underline focus:outline-none focus:ring-2 focus:ring-secondary rounded" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input autocomplete="current-password" class="block w-full rounded pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg focus:ring-1 focus:ring-secondary focus:border-secondary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full flex justify-center items-center py-md px-lg border border-transparent rounded bg-secondary text-on-primary font-button text-button shadow-sm hover:bg-secondary-fixed hover:text-on-secondary-fixed transition-all active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary gap-xs border-b-[2px] border-b-[#005049]" type="submit">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">login</span>
                    Sign In
                </button>
</form>
<div class="mt-xs pt-lg border-t border-outline-variant text-center">
<p class="font-body-lg text-body-lg text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-button text-button text-secondary hover:text-secondary-fixed transition-colors ml-xs underline-offset-4 hover:underline focus:outline-none focus:ring-2 focus:ring-secondary rounded" href="#">Create Account</a>
</p>
