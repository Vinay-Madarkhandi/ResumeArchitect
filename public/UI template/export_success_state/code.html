<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ResumeArchitect - Export Success</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#86f2e4",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#005049",
                        "tertiary-fixed-dim": "#dec29a",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#fcdeb5",
                        "on-error": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "on-background": "#0b1c30",
                        "on-tertiary-container": "#98805d",
                        "secondary": "#006a61",
                        "secondary-fixed": "#89f5e7",
                        "outline-variant": "#c6c6cd",
                        "primary-fixed-dim": "#bec6e0",
                        "on-secondary-container": "#006f66",
                        "surface-bright": "#f8f9ff",
                        "inverse-primary": "#bec6e0",
                        "tertiary": "#000000",
                        "primary": "#000000",
                        "on-surface": "#0b1c30",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-high": "#dce9ff",
                        "surface-tint": "#565e74",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dae2fd",
                        "outline": "#76777d",
                        "on-tertiary-fixed": "#271901",
                        "inverse-surface": "#213145",
                        "surface-variant": "#d3e4fe",
                        "tertiary-container": "#271901",
                        "surface-container-low": "#eff4ff",
                        "on-secondary-fixed": "#00201d",
                        "on-primary-container": "#7c839b",
                        "on-primary-fixed": "#131b2e",
                        "primary-container": "#131b2e",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#6bd8cb",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#574425",
                        "background": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "on-surface-variant": "#45464d",
                        "surface-container": "#e5eeff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "xl": "40px",
                        "base": "4px",
                        "xxl": "80px",
                        "max-width-doc": "720px",
                        "gutter": "24px",
                        "margin-desktop": "48px",
                        "sm": "8px",
                        "margin-mobile": "16px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-doc": ["\"Source Serif 4\""],
                        "headline-lg": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "button": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"]

                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-doc": ["18px", { "lineHeight": "1.7", "fontWeight": "400" }],

                        "button": ["14px", { "lineHeight": "1.0", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-full flex flex-col items-center justify-center font-body-lg">
<div class="max-w-2xl w-full p-margin-desktop bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_12px_rgba(15,23,42,0.08)] text-center relative overflow-hidden">
<!-- Success Icon -->
<div class="inline-flex items-center justify-center w-20 h-20 bg-secondary-container text-on-secondary-container rounded-full mb-lg mx-auto">
<span class="material-symbols-outlined text-4xl" data-weight="fill">check_circle</span>
</div>
<!-- Header -->
<h1 class="font-display-lg text-display-lg text-on-surface mb-sm">Export Complete</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-md mx-auto">
            Your tailored resume has been successfully generated and downloaded to your device.
        </p>
<!-- Actions -->
<div class="flex flex-col md:flex-row gap-md justify-center items-center mt-lg">
<button class="bg-primary text-on-primary font-button text-button py-sm px-lg rounded flex items-center gap-xs hover:bg-primary-container hover:text-on-primary-container transition-colors border-b border-tertiary">
<span class="material-symbols-outlined text-[18px]">folder_open</span>
                View in Library
            </button>
<button class="bg-surface-container-lowest border border-outline text-on-surface font-button text-button py-sm px-lg rounded flex items-center gap-xs hover:bg-surface-container transition-colors border-b border-outline-variant">
<span class="material-symbols-outlined text-[18px]">auto_fix_high</span>
                Tailor for Another Job
            </button>
</div>
<div class="mt-xl pt-lg border-t border-outline-variant w-full">
<button class="text-on-surface-variant hover:text-secondary font-label-sm text-label-sm flex items-center gap-xs mx-auto transition-colors">
<span class="material-symbols-outlined text-[16px]">rate_review</span>
                Share Feedback
            </button>
</div>
</div>
</body></html>
